[project]
name = "modelwrecker"
version = "0.0.2"
description = "An AI red teaming engine. Safely attacks AI systems and turns verified weaknesses into reproducible findings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Aevrin" }]
keywords = ["ai", "security", "red-teaming", "llm", "jailbreak", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Core runtime dependencies. Kept small on purpose (see docs/DEPENDENCIES.md).
# Every provider is reached over the OpenAI-compatible wire today; the extras below are for the
# planned any-llm and direct SDK adapters (issue #23).
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "cryptography>=42",  # Ed25519 check of the signed entitlement (issue #11)
]

[project.urls]
Homepage = "https://app.aevrin.net"
Repository = "https://github.com/Aevrin-ai/modelWrecker"
Documentation = "https://github.com/Aevrin-ai/modelWrecker/tree/main/docs"
Issues = "https://github.com/Aevrin-ai/modelWrecker/issues"

[project.optional-dependencies]
# Provider adapters beyond the OpenAI-compatible baseline.
providers = ["any-llm-sdk>=1.25", "openai>=1.40", "anthropic>=0.34"]
# Attack algorithms and scanning, reused behind our Strategy adapters (see ADR-0006).
attacks = ["pyrit>=1.1"]
scan = ["garak>=0.17"]
# Judge signals.
judges = ["presidio-analyzer>=2.2", "detect-secrets>=1.5"]
# MCP targets and the harness-integration MCP server (see ADR-0013).
mcp = ["mcp>=2.0"]
# Everything that installs together. `scan` is left out: garak 0.17 pins datasets<4 and PyRIT 1.1
# needs datasets>=4.8, so `attacks` and `scan` cannot be resolved into one environment.
all = [
    "modelwrecker[providers,attacks,judges,mcp]",
]
# ruff is pinned to the version CI runs, so local lint matches CI.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.9", "mypy>=1.11"]

[project.scripts]
modelwrecker = "modelwrecker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelwrecker"]

# The source archive carries only the Python engine, its tests, and the docs it points to. The web apps
# (src/web, src/dash, src/api) and deploy files are not part of the Python package.
[tool.hatch.build.targets.sdist]
include = ["/src/modelwrecker", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.uv]
# See the `all` extra: PyRIT and garak need incompatible versions of `datasets`.
conflicts = [[{ extra = "attacks" }, { extra = "scan" }], [{ extra = "all" }, { extra = "scan" }]]
