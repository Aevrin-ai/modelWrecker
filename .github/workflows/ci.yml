name: CI

# Runs every test suite and build on pushes and pull requests. Nothing here deploys or needs secrets.

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  engine:
    name: Engine (Python tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,attacks]"
      - name: Lint (ruff)
        # Pinned so a new ruff release cannot fail CI with checks nobody ran locally. Bump it on purpose.
        run: |
          pip install "ruff==0.16.9"
          python -m ruff check src tests
      - run: python -m pytest -q

  api:
    name: Control-plane API (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # Wrangler 4 needs Node 22+
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Landing and dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # Wrangler 4 needs Node 22+
      - run: npm ci && npm run build
        working-directory: src/web
      - run: npm ci && npm run build
        working-directory: src/dash
