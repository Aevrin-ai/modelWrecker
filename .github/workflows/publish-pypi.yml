name: Publish modelwrecker to PyPI

# Builds and publishes the Python package when a version tag (v*) is pushed.
# Uses PyPI Trusted Publishing (OIDC) - no API token is stored in GitHub.
#
# One-time setup on PyPI (maintainer, see deploy/pypi/README.md):
#   1. Create/claim the project name "modelwrecker" on PyPI.
#   2. Add a Trusted Publisher: GitHub owner/repo, workflow "publish-pypi.yml",
#      environment "pypi".
#
# Release: bump version in pyproject.toml, commit, then:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (offline/dev) and run the offline test suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,attacks]"
          python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses an API token if the PYPI_API_TOKEN secret is set; when it is empty, the action falls
          # back to Trusted Publishing (OIDC). Either way no token is stored in the repo.
          password: ${{ secrets.PYPI_API_TOKEN }}
