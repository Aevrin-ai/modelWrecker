# Aevrin control-plane API. Served on the dashboard's own origin at vyra.aevrin.ai/api/*, and still on
# app.aevrin.net/api/* so already-installed modelwrecker CLI clients (which default to app.aevrin.net) keep working.
# Nothing secret lives in this public file. Secrets are set once per Worker with
# `npx wrangler secret put <NAME>`:
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY   database (deploy/cloudflare/README.md)
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET  billing (docs/billing/razorpay.md)
#   ENTITLEMENT_SIGNING_KEY                                      Ed25519 private key, PKCS#8 base64 (docs/security/entitlements.md)
#   ADMIN_TOTP_KEY                                               encrypts admin authenticator secrets (docs/security/admin.md)
#   ANALYTICS_SALT                                               page analytics visitor hash (docs/analytics/page-analytics.md)
# Any optional group that is missing turns its feature off safely (billing 503, free-baseline entitlements).
# See deploy/cloudflare/README.md and docs/architecture/control-plane-api.md.
name = "aevrin-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Both /api/* hosts reach this Worker; the Pages project serves everything else on each domain. The
# browser app lives on vyra.aevrin.ai; app.aevrin.net stays for the CLI (its page loads 301 to vyra).
routes = [
  { pattern = "vyra.aevrin.ai/api/*", zone_name = "aevrin.ai" },
  { pattern = "app.aevrin.net/api/*", zone_name = "aevrin.net" },
]

[vars]
# The browser app's own origin: CORS/anti-CSRF guard, the device-login URL, and the analytics host.
APP_ORIGIN = "https://vyra.aevrin.ai"
# The entitlement issuer stays app.aevrin.net: every shipped engine trusts only this issuer, so it must
# not change when the browser origin moves (src/modelwrecker/entitlements/token.py ISSUERS).
ENTITLEMENT_ISSUER = "https://app.aevrin.net"
# The public half of the entitlement signing key. The engine ships the same value in
# src/modelwrecker/entitlements/token.py; GET /api/v1/entitlements/keys publishes it.
ENTITLEMENT_KEY_ID = "2026-10-a"
ENTITLEMENT_PUBLIC_KEY = "trSV1ue_ymSzW9Ga60p5rH2maEuebDE_Dk72NHicYp4"

# No cron trigger. The daily data cleanup runs inside Supabase with pg_cron
# (deploy/supabase/migrations/0006_scheduled_cleanup.sql). The empty list makes `wrangler deploy` remove
# the trigger this Worker used to have.
[triggers]
crons = []
